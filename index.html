<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#4f8ef7;--acrgb:79,142,247;--bg:#0d0f1a;--card:rgba(255,255,255,.05);--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.1);--tx:#eef0ff;--tx2:#8892b0;--tx3:#5a6280;--cs:155px;--gap:13px;--r:14px;--blur:14px;--snow:1;--steam:1;--font:'Space Grotesk',system-ui,sans-serif}
[data-theme=light]{--bg:#f0f2fa;--card:rgba(255,255,255,.75);--glass:rgba(255,255,255,.85);--bd:rgba(0,0,0,.12);--tx:#1a1e3a;--tx2:#4a5270;--tx3:#8a90ae}
[data-perf=low]{--blur:0px;--snow:0;--steam:0}
[data-perf=med]{--blur:4px;--snow:.5;--steam:.5}
[data-layout=compact]{--cs:118px;--gap:9px}
*{box-sizing:border-box;margin:0;padding:0;font-family:inherit}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--font);transition:background .3s,color .3s}
button,input{color:inherit;font-size:inherit}button{cursor:pointer;background:none;border:0}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
#wall{position:fixed;inset:0;background:center/cover;opacity:0;z-index:0;pointer-events:none}
#snow,#steam{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;transition:opacity .4s}
#snow{opacity:var(--snow)}#steam{opacity:var(--steam)}
#snow::before,#snow::after{content:"";position:absolute;left:0;right:0;top:-600px;bottom:0;background-image:var(--flakes);background-size:600px 600px;animation:fall 20s linear infinite}
#snow::after{animation-duration:34s;background-position:240px 120px;opacity:.7}
@keyframes fall{to{transform:translateY(600px)}}
.sp{position:absolute;bottom:-20px;border-radius:50%;background:rgba(var(--acrgb),.4);filter:blur(3px);animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--sx),-110vh);opacity:0}}
#loader{position:fixed;inset:0;z-index:20000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
.logo{font-size:2.2rem;font-weight:700;letter-spacing:2px}.logo em{color:var(--ac);font-style:normal}
.bar{width:180px;height:3px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);animation:ld 1.2s ease forwards}
@keyframes ld{from{width:0}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:var(--glass);backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--bd);position:relative;z-index:50}
.nl,.nr{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.nr{justify-content:flex-end}
.rel{position:relative}
.sw{position:relative;flex:1;max-width:260px}.sw svg{position:absolute;left:11px;top:9px;color:var(--tx2)}
#q{width:100%;height:34px;padding:0 12px 0 34px;border-radius:20px;border:1px solid var(--bd);background:var(--card);outline:0}
#q:focus{border-color:var(--ac)}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:20px;padding:3px}
.tab{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:16px;font-size:13px;color:var(--tx2)}

.dd{display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:200px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.45);z-index:60;overflow:hidden}
.dd.open{display:block}
#sug{width:100%}#sortdd{min-width:170px}
#setdd{left:auto;right:0;width:min(92vw,340px);max-height:80vh;overflow:auto;padding:14px}
.opt{display:block;width:100%;text-align:left;padding:9px 14px;font-size:13px}.opt:hover,.opt.on{background:rgba(var(--acrgb),.18)}
.opt small{float:right;color:var(--tx3)}.opt.dym{color:var(--tx2)}
main{flex:1;overflow:auto;padding:6px 18px 40px}
.lbl{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx2);margin:16px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cs),1fr));gap:var(--gap)}
.card{position:relative;aspect-ratio:1;border-radius:var(--r);background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;content-visibility:auto;contain-intrinsic-size:var(--cs) var(--cs);}
.em{flex:1;display:grid;place-items:center;font-size:2.6rem}
.nm{padding:8px 10px;font-size:12px;font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.25)}
.fav{position:absolute;top:6px;right:6px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:13px}
.fav.on{color:#ffc93c}
.cat{position:absolute;top:6px;left:6px;font-size:9px;padding:2px 7px;border-radius:10px;background:rgba(var(--acrgb),.85);color:#fff}
.anim{animation:pop .4s backwards}@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 6px}
.chip{flex:none;padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--bd);font-size:12px;white-space:nowrap}
.none{text-align:center;color:var(--tx2);padding:50px 0}.none b{display:block;font-size:2rem;margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:9000;display:none;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center}
.ov.show{display:flex}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);width:min(92vw,440px);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:600}
.x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.bd{padding:14px 16px;overflow:auto}
.sec{margin-bottom:16px}.st{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx2);margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.btn{flex:1;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--card);font-size:12px}
.btn.danger{color:#ff7090;border-color:rgba(255,50,90,.4)}
.inp{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--card);outline:0;margin-bottom:6px}.inp:focus{border-color:var(--ac)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:13px}.tog small{display:block;color:var(--tx3);font-size:11px}
.tog input{width:36px;height:18px;accent-color:var(--ac);flex:none}
.dots{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd)}.dot:hover{border-color:var(--tx)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.fonts .btn{flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--ac)}
.lb{font-size:10px;color:var(--tx3);letter-spacing:1px;margin:6px 0 2px}
.play{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ac);color:#fff;font-weight:700;letter-spacing:1px;background:#1a1a1a}
#pp{text-align:center;margin-bottom:8px;pointer-events:none}
.mh{display:flex;align-items:center;gap:12px}.mi{font-size:2rem}.mt{font-size:12px;color:var(--tx2)}
.hp{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;padding:10px 12px;background:var(--card)}
.hp summary{cursor:pointer;font-weight:600;font-size:13px}.hp p{margin-top:8px;font-size:12px;line-height:1.6;color:var(--tx2)}
.cl{font-size:12px;color:var(--tx2);line-height:1.5;margin-bottom:6px}.cl b{color:var(--ac)}
#viewer{position:fixed;inset:0;z-index:10000;display:none;flex-direction:column;background:var(--bg)}
#viewer.show{display:flex}
.vb{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--bd);font-weight:600}
#frame{flex:1;width:100%;border:0;background:#000}
#dbg{position:fixed;left:10px;bottom:10px;z-index:9500;background:rgba(0,0,0,.75);color:#8f8;font:11px monospace;padding:8px 10px;border-radius:8px;line-height:1.5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:30000;padding:10px 18px;border-radius:10px;color:#fff;font-size:13px;background:rgba(var(--acrgb),.92)}
.toast.err{background:rgba(220,50,80,.92)}

/* button style: radial gradient, glowing bottom line, scale+lift on hover (original radii kept) */
:root{--b1:rgba(71,81,92,.30);--b2:rgba(255,255,255,.04);--bt:rgba(255,255,255,.66);--bth:rgb(255,255,255);--bl:255,255,255;--bin:rgba(255,255,255,.1);--ease:cubic-bezier(.15,.83,.66,1)}
[data-theme=light]{--b1:rgba(255,255,255,.75);--b2:rgba(205,212,234,.30);--bt:rgba(26,30,58,.66);--bth:rgb(26,30,58);--bl:26,30,58;--bin:rgba(0,0,0,.1)}
.card,.btn:not(.on),.chip,.ib,.tab:not(.on),.play{position:relative;border-color:transparent;box-shadow:inset 0 0 0 1px var(--bd);background:radial-gradient(ellipse at bottom,var(--b1) 0%,var(--b2) 45%);color:var(--bt);transition:all 1s var(--ease)}
.btn.danger:not(.on){color:#ff7090}.play{color:#fff}
.card::before,.btn::before,.chip::before,.ib::before,.tab::before,.play::before{content:"";width:70%;height:1px;position:absolute;bottom:0;left:15%;pointer-events:none;background:linear-gradient(90deg,rgba(var(--bl),0) 0%,rgba(var(--bl),1) 50%,rgba(var(--bl),0) 100%);opacity:.2;transition:all 1s var(--ease)}
.card:hover,.btn:hover,.chip:hover,.ib:hover,.tab:hover,.play:hover{color:var(--bth);transform:scale(1.1) translateY(-3px);z-index:3}
.btn.danger:hover{color:#ff7090}.play:hover{color:#fff}
.card:hover::before,.btn:hover::before,.chip:hover::before,.ib:hover::before,.tab:hover::before,.play:hover::before{opacity:1}
[data-perf=low] .card,[data-perf=low] .card::before{transition-duration:.2s}
/* selected state: semi-transparent like the search bar */
.tab.on,.btn.on{background:rgba(var(--acrgb),.22);box-shadow:inset 0 0 0 1px rgba(var(--acrgb),.55);border-color:transparent;color:var(--tx);backdrop-filter:blur(var(--blur));transition:all 1s var(--ease)}
.tab.on:hover,.btn.on:hover{color:var(--tx)}
.msgs{height:min(46vh,320px);overflow:auto;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--card);font-size:13px}
.m{padding:3px 0;word-break:break-word;line-height:1.4}.m b{color:var(--ac)}.m small{color:var(--tx3);margin-left:6px}.m i{font-style:normal;color:var(--tx3);cursor:pointer;margin-left:6px;opacity:0}.m:hover i{opacity:1}.m.sys{color:var(--tx2);font-style:italic}
.bdg{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#e5484d;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;pointer-events:none}
@media(max-width:720px){nav{flex-wrap:wrap}.tabs{order:3;width:100%;justify-content:center}.nl,.nr{flex:none}.nl{flex:1}main{padding:4px 12px 40px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

</div>

const sb=(k,v,t,st='')=>`<button class="btn" data-set="${k}:${v}" style="${st}">${t}</button>`;
const DATA='<div class="row"><button class="btn" data-act="export">⬇ Export</button><button class="btn" data-act="import">⬆ Import</button></div>';
function bgDots(){const b=$('#bgdots');if(b)b.replaceChildren(...(ST.theme==='light'?BGL:BGD).map(c=>{const d=document.createElement('button');d.className='dot';d.style.background=c;d.dataset.bg=c;d.title=c;return d}))}
function buildSettings(){
  $('#setdd').innerHTML=
   S('Theme',`<div class="row">${sb('theme','dark','🌙 Dark')}${sb('theme','light','☀️ Light')}</div>`)+
   S('UI Accent Color',['hue:HUE:0:360','sat:SATURATION:0:100','bri:BRIGHTNESS:20:100'].map(s=>{const[k,l,a,b]=s.split(':');return`<div class="lb">${l}</div><input type="range" data-r="${k}" min="${a}" max="${b}" value="${ST[k]}">`}).join('')+`<div class="dots">${ACCENTS.map(a=>`<button class="dot" data-ac="${a}" style="background:hsl(${a[0]},${a[1]}%,${a[2]}%)"></button>`).join('')}</div>`)+
   S('Background Color',`<div class="dots" id="bgdots" style="margin:0 0 8px"></div><div class="row"><input class="inp" id="bgc" placeholder="#0d0f1a or rgb(...)" style="margin:0"><button class="btn" style="flex:none" data-act="bgapply">Apply</button></div>`)+
   S('Font',`<div class="fonts">${FONTS.map(f=>sb('font',f.n,f.n,`font-family:${f.css.replace(/"/g,"'")}`)).join('')}</div>`)+
   S('Layout',`<div class="row">${sb('layout','comfy','Comfy')}${sb('layout','compact','Compact')}</div>`)+
   S('Performance Mode',`<p class="cl">Optimized for Chromebooks &amp; low-end devices</p><div class="row">${sb('perf','low','LOW')}${sb('perf','med','MED')}${sb('perf','high','HIGH')}</div>`)+
   S('Options',tg('snow','Snow Effect','Falling snow animation')+tg('steam','Steam Effect','Particles that rise upwards')+tg('recents','Show Recents','Display recently played games')+tg('playNow','Play Now Screen','Show a screen before launching a game'))+
   `<div class="sec" id="psec"><div class="st">Customize Play Screen</div><div class="play" id="pp"></div><div class="lb">BUTTON LABEL</div><input class="inp" data-t="playLabel" value="${ST.playLabel.replace(/"/g,'&quot;')}"><div class="lb">BUTTON COLOR</div><input class="inp" data-t="playColor" value="${ST.playColor}"><div class="lb">DESCRIPTION TEXT</div><input class="inp" data-t="playDesc" value="${ST.playDesc.replace(/"/g,'&quot;')}"></div>`+
   S('Import / Export Settings',DATA)+S('Reset','<button class="btn danger" style="width:100%" data-act="reset">Reset All Settings</button>');
  $('#sortdd').innerHTML=SORTS.map(([k,l])=>`<button class="opt" data-set="sort:${k}">${l}</button>`).join('');
  bgDots();
}

/* ---------- effects ---------- */
function initFx(){
  const f=[];for(let i=0;i<70;i++){const v=2+Math.floor(Math.random()*4),x=v+Math.floor(Math.random()*(600-2*v)),y=v+Math.floor(Math.random()*(600-2*v));f.push(`radial-gradient(${v}px ${v}px at ${x}px ${y}px,rgba(255,255,255,${(.5+Math.random()*.5).toFixed(2)}) 50%,transparent)`)}
  $('#snow').style.setProperty('--flakes',f.join(','));
  const st=$('#steam');for(let i=0;i<(lowEnd?24:45);i++){const p=document.createElement('div'),s=3+Math.random()*8;p.className='sp';p.style.cssText=`left:${Math.random()*100}%;--sx:${(Math.random()-.5)*120}px;width:${s}px;height:${s}px;animation-duration:${8+Math.random()*14}s;animation-delay:-${Math.random()*12}s;opacity:${.05+Math.random()*.35}`;st.appendChild(p)}
}
let fps=0,fc=0,fl=0;
function dbgLoop(){requestAnimationFrame(function l(t){if(ST.debug){fc++;if(t-fl>=1000){fps=fc;fc=0;fl=t}}requestAnimationFrame(l)});
  setInterval(()=>{if(ST.debug)$('#dbg').innerHTML=`⚙ DEBUG<br>FPS: ${fps}<br>Games: ${DB.length}<br>Mem: ${performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576)+'MB':'N/A'}<br>${new Date().toLocaleTimeString()}`},1000)}

/* ---------- games ---------- */
function list(){
  let g=DB.filter(x=>!q||(x.n+' '+x.c).toLowerCase().includes(q.toLowerCase()));const s=ST.sort;
  if(s==='az')g.sort((a,b)=>a.n.localeCompare(b.n));else if(s==='za')g.sort((a,b)=>b.n.localeCompare(a.n));
  else if(s==='recent')g.reverse();else if(s==='played')g.sort((a,b)=>(PLAYED[b.f]||0)-(PLAYED[a.f]||0));
  else if(s==='favfirst')g.sort((a,b)=>FAVS.includes(b.f)-FAVS.includes(a.f));
  return g}
function card(g,i){
  const d=document.createElement('div'),on=FAVS.includes(g.f);d.className='card'+(ST.anim&&i!=null?' anim':'');d.dataset.f=g.f;
  if(ST.anim&&i!=null)d.style.animationDelay=Math.min(i*.02,.4)+'s';
  d.innerHTML=`<div class="em"></div><div class="nm"></div><div class="fav${on?' on':''}">${on?'★':'☆'}</div>${ST.cats?'<div class="cat"></div>':''}`;
  d.children[0].textContent=g.e;d.children[1].textContent=g.n;if(ST.cats)d.children[3].textContent=g.c;return d}
function fill(sel,games,anim){const f=document.createDocumentFragment();games.forEach((g,i)=>f.appendChild(card(g,anim?i:null)));$(sel).replaceChildren(f)}
const lev=(a,b)=>{const dp=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)dp[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[a.length][b.length]};
function dym(){
  const ql=q.toLowerCase();let best=null,bd=5;DB.forEach(g=>{const d=lev(ql,g.n.toLowerCase());if(d<bd){bd=d;best=g}});
  const e=$('#dym');e.textContent='';if(best&&bd<=4){e.append('Did you mean: ');const b=document.createElement('button');b.className='chip';b.dataset.q=best.n;b.textContent=best.e+' '+best.n;e.append(b,'?')}else e.textContent='Try a different search term'}
function render(){
  const g=list(),lb=$('#alllbl');fill('#grid',g,true);
  lb.textContent=q?`Results for "${q}" (${g.length})`:'All Games';lb.classList.toggle('hidden',!g.length);$('#nores').classList.toggle('hidden',!!g.length);if(!g.length)dym();
  const fv=FAVS.map(byF).filter(Boolean),rc=REC.map(byF).filter(Boolean);
  $('#favh').classList.toggle('hidden',!fv.length||!!q);fill('#favgrid',fv);
  $('#rec').classList.toggle('hidden',!ST.recents||!rc.length||!!q);
  $('#recrow').replaceChildren(...rc.slice(0,14).map(x=>{const c=document.createElement('button');c.className='chip';c.dataset.f=x.f;c.textContent=x.e+' '+x.n;return c}));
  fill('#favfull',fv);$('#nofav').classList.toggle('hidden',!!fv.length);
  fill('#recgrid',rc);$('#norec').classList.toggle('hidden',!!rc.length)}
function toggleFav(f){const i=FAVS.indexOf(f);i<0?FAVS.unshift(f):FAVS.splice(i,1);save();render();modalFav()}
function modalFav(){if(cur)$('#mfav').textContent=FAVS.includes(cur.f)?'★':'☆'}
function openGame(g){
  if(!g)return;cur=g;if(!ST.playNow)return play();
  $('#gmi').textContent=g.e;$('#gmn').textContent=g.n;$('#gmt').textContent=g.c;
  $('#gmd').textContent=`Play ${g.n} — a ${g.c.toLowerCase()} game. ${ST.playDesc}`;
  const p=$('#play');p.textContent='▶ '+(ST.playLabel||'PLAY NOW');p.style.background=ST.playColor;modalFav();$('#modal').classList.add('show')}
function play(){
  const g=cur;if(!g)return;$('#modal').classList.remove('show');
  REC=[g.f,...REC.filter(x=>x!==g.f)].slice(0,20);PLAYED[g.f]=(PLAYED[g.f]||0)+1;save();render();
  $('#vt').textContent=g.n;const fr=$('#frame'),v=$('#viewer');fr.removeAttribute('srcdoc');v.classList.add('show');
  fetch(CDN+encodeURIComponent(g.f.includes('.')?g.f:g.f+'.html')).then(r=>{if(!r.ok)throw 0;return r.text()})
   .then(h=>{if(v.classList.contains('show'))fr.srcdoc=h}).catch(()=>{closeViewer();toast('Failed to load game','err')})}
function closeViewer(){$('#viewer').classList.remove('show');$('#frame').removeAttribute('srcdoc')}
function goSec(s){sec=s;['home','favs','recents'].forEach(x=>{$('#s-'+x).classList.toggle('hidden',x!==s)});$$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.sec===s))}

/* ---------- search ---------- */
function sug(){
  const b=$('#sug'),m=q?DB.filter(g=>g.n.toLowerCase().startsWith(q.toLowerCase())).slice(0,7):[];
  b.replaceChildren(...m.map(g=>{const o=document.createElement('button');o.className='opt';o.dataset.q=g.n;o.textContent=g.e+' '+g.n;const s=document.createElement('small');s.textContent=g.c;o.append(s);return o}));
  b.classList.toggle('open',m.length>0)}
function setQ(v){q=v.trim();$('#q').value=v;clearTimeout(tm);render();sug();closeDD()}
function closeDD(){$$('.dd').forEach(d=>d.classList.remove('open'))}

/* ---------- panels ---------- */
const PANELS={
 more:()=>['☰ More',S('Wallpaper Manager','<div class="row"><input class="inp" id="wu" placeholder="Paste image URL..." style="margin:0"><button class="btn" style="flex:none" data-act="wallurl">Apply</button></div><div class="row"><button class="btn" data-act="wallfile">⬆ Upload image</button><button class="btn danger" data-act="wallclear">✕ Remove</button></div>')+
  S('Debug Tools',tg('debug','Debug Overlay','Shows FPS and memory usage'))+S('Advanced Settings',tg('cats','Card Categories','Show category badge on cards')+tg('anim','Card Animations','Entrance animation on game cards'))+
  S('Import / Export Data',DATA)+S('Changelog','<div class="cl"><b>v3.0</b> Clean rebuild: faster rendering, in-page game viewer, safer storage, settings that save reliably.</div><div class="cl"><b>v2.0</b> Top navigation, new fonts, steam effect, light mode, sort dropdown, background colors, play screen options.</div><div class="cl"><b>v1.0</b> Initial release: 500+ games, settings, snow effect, favorites, recents, search.</div>')+
  S('Credits','<div class="cl"><b>UGS (Ultimate Game Stash)</b> — game library &amp; hosting<br><b>Nix</b> — frontend portal</div>')],
 account:()=>['👤 Account',OFF?S('Accounts','<p class="cl">Accounts and chat need the Nix server. Start it with <b>node server.js</b> and open the site from that address.</p>'):ME
   ?S('Signed in',`<p class="cl">You are signed in as <b>${ME.name}</b>${ME.admin?' (moderator)':''}. Your login is kept in a secure cookie on this device.</p><div class="row"><button class="btn" data-act="logout">Sign out</button><button class="btn danger" data-act="delacc">Delete account</button></div>`)
   :S('Sign in or create an account',`<input class="inp" id="au" data-auth placeholder="Username (3-16 letters/numbers)" autocomplete="username" maxlength="16"><input class="inp" id="ap" data-auth type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><div class="row"><button class="btn" data-act="login">Log in</button><button class="btn" data-act="signup">Sign up</button></div><p class="cl">No email needed. Use a username that doesn't reveal your real name, and a password you don't use anywhere else.</p>`)],
 chat:()=>['💬 Global Chat',OFF?S('Chat','<p class="cl">Chat needs the Nix server. Start it with <b>node server.js</b> and open the site from that address.</p>'):!ME
   ?S('Chat','<p class="cl">Sign in to read and join the chat.</p><button class="btn" style="width:100%" data-open="account">Sign in / Sign up</button>')
   :`<div class="st" id="onl">Chat</div><div class="msgs" id="msgs"></div><div class="row"><input class="inp" id="cin" maxlength="300" placeholder="Say something friendly..." autocomplete="off" style="margin:0"><button class="btn" style="flex:none" data-act="send">Send</button></div><p class="cl">Be kind. No links or personal info. Messages are logged and moderated; hover a message and tap ⚑ to report it.</p>`],
 help:()=>['❓ Help',HELP.map(h=>`<details class="hp"><summary>${h.i} ${h.t}</summary><p>${h.b}</p></details>`).join('')]};
function openPanel(n){const[t,b]=PANELS[n]();$('#pt').textContent=t;$('#pb').innerHTML=b;$('#panel').classList.add('show');apply();if(n==='chat'){UNR=0;badge();drawChat()}}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}
function setWall(u){const o=ST.wall;ST.wall=u;if(save())apply();else{ST.wall=o;save()}}
const ACT={
 play,closeviewer:closeViewer,favmodal:()=>cur&&toggleFav(cur.f),
 wallurl:()=>{const u=$('#wu').value.trim();u?setWall(u):toast('Enter a URL','err')},
 wallfile:()=>pickFile('image/*',f=>{const r=new FileReader();r.onload=e=>setWall(e.target.result);r.readAsDataURL(f)}),
 wallclear:()=>{ST.wall='';save();apply();toast('Wallpaper removed')},
 bgapply:()=>{const v=$('#bgc').value.trim();if(!v)return;if(!CSS.supports('color',v))return toast('Not a valid color','err');ST.bg=v;save();apply()},
 export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({ST,FAVS,REC,PLAYED})],{type:'application/json'}));a.download='nix-settings.json';a.click()},
 import:()=>pickFile('.json',f=>{const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.ST)ST={...D,...d.ST};if(Array.isArray(d.FAVS))FAVS=d.FAVS;if(Array.isArray(d.REC||d.RECENTS))REC=d.REC||d.RECENTS;if(d.PLAYED)PLAYED=d.PLAYED;save();location.reload()}catch{toast('Invalid settings file','err')}};r.readAsText(f)}),
 reset:()=>{if(confirm('Reset all settings, favorites and recents?')){Object.values(K).forEach(k=>localStorage.removeItem(k));location.reload()}}};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const c=s=>e.target.closest(s);let t;
  if(!c('.dd,[data-dd],.sw'))closeDD();
  if(e.target.classList.contains('ov')||c('[data-close]')){$('#modal').classList.remove('show');$('#panel').classList.remove('show')}
  if(t=c('[data-act]'))ACT[t.dataset.act]();
  else if(t=c('[data-set]')){const[k,...v]=t.dataset.set.split(':');set(k,v.join(':'));if(k==='sort')closeDD()}
  else if(t=c('[data-dd]')){const d=$('#'+t.dataset.dd),o=d.classList.contains('open');closeDD();d.classList.toggle('open',!o)}
  else if(t=c('[data-rep]'))report(+t.dataset.rep);
  else if(t=c('[data-open]'))openPanel(t.dataset.open);
  else if(t=c('[data-sec]'))goSec(t.dataset.sec);
  else if(t=c('[data-q]'))setQ(t.dataset.q);
  else if(t=c('[data-bg]')){ST.bg=t.dataset.bg;save();apply();$('#bgc').value=ST.bg}
  else if(t=c('[data-ac]')){[ST.hue,ST.sat,ST.bri]=t.dataset.ac.split(',').map(Number);save();apply();$$('[data-r]').forEach(r=>r.value=ST[r.dataset.r])}
  else if(c('.fav'))toggleFav(c('.card').dataset.f);
  else if(t=c('.card,.chip[data-f]'))openGame(byF(t.dataset.f));
});
document.addEventListener('change',e=>{const k=e.target.dataset.k;if(k)set(k,e.target.checked)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.r){ST[t.dataset.r]=+t.value;save();apply()}
  else if(t.dataset.t){ST[t.dataset.t]=t.value;save();apply()}
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim();clearTimeout(tm);tm=setTimeout(render,90);sug()});
$('#q').addEventListener('focus',sug);
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape')setQ('')});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#viewer').classList.contains('show'))closeViewer();else{$('#modal').classList.remove('show');$('#panel').classList.remove('show');closeDD()}});

/* ---------- accounts & chat (requires server.js) ---------- */
let ME=null,WS=null,MSGS=[],ONL=0,UNR=0,retry=0,OFF=false;
async function api(p,b){try{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));return r.ok?j:{error:j.error||'Request failed'}}catch{return{error:'Server not reachable',off:1}}}
async function loadMe(){const j=await api('me');OFF=!!j.off;ME=j.user||null;ME?connect():closeWS();badge()}
const chatOpen=()=>$('#panel').classList.contains('show')&&!!$('#msgs');
function badge(){const b=$('#cbadge');b.textContent=UNR>9?'9+':UNR;b.classList.toggle('hidden',!UNR)}
function closeWS(){const w=WS;WS=null;MSGS=[];if(w)try{w.close()}catch{}}
function connect(){
  if(WS||!ME)return;let w;try{w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch{return}
  WS=w;w.onopen=()=>{retry=0};
  w.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}
    if(d.t==='hist'){MSGS=d.msgs;ONL=d.online}
    else if(d.t==='msg'){MSGS.push(d.m);if(MSGS.length>200)MSGS.shift();if(!chatOpen()&&d.m.u!==ME.name){UNR++;badge()}}
    else if(d.t==='del')MSGS=MSGS.filter(m=>m.id!==d.id);
    else if(d.t==='online')ONL=d.n;
    else MSGS.push({id:0,sys:1,x:d.m});
    drawChat()};
  w.onclose=()=>{if(WS!==w)return;WS=null;if(ME&&retry<6)setTimeout(connect,Math.min(1000*2**retry++,15000));drawChat()}}
function drawChat(){
  const box=$('#msgs');if(!box)return;const stick=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  $('#onl').textContent=WS&&WS.readyState===1?`● ${ONL} online`:'Connecting...';
  box.replaceChildren(...MSGS.map(m=>{const d=document.createElement('div');d.className='m'+(m.sys?' sys':'');
    if(m.sys)d.textContent=m.x;else{const b=document.createElement('b');b.textContent=m.u;const s=document.createElement('small');s.textContent=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const f=document.createElement('i');f.textContent='⚑';f.title='Report';f.dataset.rep=m.id;d.append(b,': ',m.x,s,f)}return d}));
  if(stick)box.scrollTop=box.scrollHeight}
function report(id){if(WS&&WS.readyState===1)WS.send(JSON.stringify({t:'report',id}))}
async function auth(p){const u=$('#au').value.trim(),pw=$('#ap').value;if(!u||!pw)return toast('Enter a username and password','err');
  const j=await api(p,{username:u,password:pw});if(j.error)return toast(j.error,'err');ME=j.user;OFF=false;connect();toast('Welcome, '+ME.name);openPanel('chat')}
Object.assign(ACT,{
  login:()=>auth('login'),signup:()=>auth('signup'),
  logout:async()=>{await api('logout',{});ME=null;closeWS();UNR=0;badge();toast('Signed out');openPanel('account')},
  delacc:async()=>{const pw=prompt('Enter your password to permanently delete your account and messages:');if(!pw)return;const j=await api('delete',{password:pw});if(j.error)return toast(j.error,'err');ME=null;closeWS();badge();toast('Account deleted');openPanel('account')},
  send:()=>{const i=$('#cin'),x=i.value.trim();if(!x)return;if(!WS||WS.readyState!==1)return toast('Not connected','err');WS.send(JSON.stringify({t:'msg',x}));i.value='';i.focus()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='cin')ACT.send();else if(e.target.dataset.auth!==undefined)ACT.login()});

/* ---------- init ---------- */
buildSettings();apply();initFx();render();dbgLoop();
loadMe();
setTimeout(()=>$('#loader').classList.add('hide'),1300);
</script>
</body>
